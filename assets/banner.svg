<svg width="900" height="230" viewBox="0 0 900 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050a0f"/>
      <stop offset="100%" stop-color="#0d1b1a"/>
    </linearGradient>
    <pattern id="circuit" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M0 30 H20 V10 H60 M30 60 V40 H60" stroke="#0f3d33" stroke-width="1.5" fill="none"/>
      <circle cx="20" cy="10" r="2" fill="#0f3d33"/>
      <circle cx="30" cy="40" r="2" fill="#0f3d33"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="clip">
      <rect x="0" y="0" width="900" height="230" rx="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="900" height="230" fill="url(#bg)"/>
    <rect width="900" height="230" fill="url(#circuit)" opacity="0.55"/>

    <!-- title bar -->
    <rect x="0" y="0" width="900" height="34" fill="#0a1a17"/>
    <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
    <circle cx="42" cy="17" r="6" fill="#ffbd2e"/>
    <circle cx="64" cy="17" r="6" fill="#27c93f"/>
    <text x="450" y="22" font-family="monospace" font-size="13" fill="#5fa89c" text-anchor="middle">vidit@system — /home/vidit — 900x230</text>
    <line x1="0" y1="34" x2="900" y2="34" stroke="#123a33" stroke-width="1"/>

    <!-- glitch title -->
    <text x="450" y="115" font-family="monospace" font-weight="bold" font-size="54" fill="#ff2ec4" text-anchor="middle" filter="url(#glow)" opacity="0.55">
      VIDIT KAUSHIK
      <animate attributeName="x" values="450;446;452;450" dur="2.6s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="115" font-family="monospace" font-weight="bold" font-size="54" fill="#00e0ff" text-anchor="middle" filter="url(#glow)" opacity="0.55">
      VIDIT KAUSHIK
      <animate attributeName="x" values="450;454;448;450" dur="2.9s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="115" font-family="monospace" font-weight="bold" font-size="54" fill="#00ff9c" text-anchor="middle" filter="url(#glow)">VIDIT KAUSHIK</text>

    <!-- subtitle -->
    <text x="450" y="150" font-family="monospace" font-size="17" fill="#8affda" text-anchor="middle">root@vidit:~$ whoami</text>
    <text x="450" y="175" font-family="monospace" font-size="15" fill="#4fd6b0" text-anchor="middle">&gt; ML builder · training models by day, soldering boards by night</text>

    <!-- blinking cursor -->
    <rect x="628" y="163" width="10" height="16" fill="#00ff9c">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- scanlines -->
    <g opacity="0.12">
      <rect x="0" y="0" width="900" height="2" fill="#00ff9c">
        <animate attributeName="y" values="0;230" dur="3.5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <line x1="0" y1="34" x2="900" y2="34" stroke="#123a33" stroke-width="1"/>
    <rect x="0.5" y="0.5" width="899" height="229" rx="10" fill="none" stroke="#0f3d33" stroke-width="1"/>
  </g>
</svg>
